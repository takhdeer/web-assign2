<!DOCTYPE html>

<html>


    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/styles.css">
    </head>


    <body class="flex min-h-screen flex-col bg-stone-50 text-stone-800">

        <header class="sticky top-0 z-40 border-b border-stone-200 bg-white/90 ">
            <nav class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-3">
                <a href="#" data-view="home" class="text-2xl font-extrabold tracking-tight text-brand-700">
                    (Logo)
                </a>
                
                <ul class="flex items-center gap-1 text-sm font-medium sm:gap-4">
                    <li><a href="#" data-view="home" class="nav-link">Home</a></li>
                    <li><a href="#" data-view="browse" class="nav-link">Browse</a></li>
                    <li><a href="#" data-view="category" class="nav-link">Category</a></li>
                    <li><button type="button" id="about-open" class="nav-link">About</button></li>
                </ul>
                
                <a href="#" data-view="cart" class="relative flex items-center gap-1 rounded-full px-3 py-1.5 text-sm font-semibold text-stone-800 hover:bg-stone-100">
                    Cart
                    <span id="cart-count" class="hidden font-semibold text-brand-700"></span>
                </a>
            </nav>
        </header>
        
    <main class="mx-auto w-full max-w-7xl flex-1 px-4 py-8">

        <!-- home view -->
        <article id="home" class="view">
            <section class="relative overflow-hidden rounded-3xl">
                <!-- (Home) -->

            </section>

            <section class="mt-12">
                <h2 class="mb-6 text-2xl font-bold">Featured Products</h2>
                <div id="featured-grid" class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4"></div>
            </section>
            
        </article>

        <!-- category view -->
        <article id="category" class="view hidden">
            (Category)
        </article>



        <!-- browse view -->
        <article id="browse" class="view hidden">
            (Browse)
        </article>

        <!-- single product view -->
        <article id="singleProduct" class="view hidden">
            (Single Product)

        </article>

        <!-- shopping cart view -->
        <article id="cart" class="view hidden">
            <h2 class="mb-6 text-2xl font-bold">Shopping Cart</h2>

            <div class="grid grid-cols-1 gap-6 lg:grid-cols-3">
                <!-- cart product rows (filled by renderCartView in js/view/cartView.js) -->
                <div id="cart-items" class="divide-y divide-gray-200 rounded-lg border border-gray-200 bg-white lg:col-span-2"></div>

                <!-- shipping selector -->
                <div id="cart-shipping" class="rounded-lg border border-gray-200 bg-white p-4">
                    <label id="shipping-label" class="mb-2 block font-medium text-gray-900">Shipping destination</label>
                    <select id="shipping-destination" class="w-full rounded-lg border border-gray-200 p-2">
                        <option value="CAN">Canada</option>
                        <option value="US">US</option>
                        <option value="INT">International</option>
                    </select>
                    <label id="shipping-label" class="mb-2 block font-medium text-gray-900">Shipping Type</label>
                    <select id="shipping-type" class="w-full rounded-lg border border-gray-200 p-2">
                        <option value="STAN">Standard</option>
                        <option value="EXP">Express</option>
                        <option value="PRI">Priority</option>
                    </select>

                    <!-- order summary (filled by renderCartSummary in js/view/cartView.js) -->
                     <!-- Citation: https://w3schools.dev/html/html_lists_other.asp -->
                    <h3 class="mt-6 mb-2 font-medium text-gray-900">Summary</h3>
                    <dl id="cart-summary" class="grid grid-cols-2 gap-y-1 text-sm">
                        <dt>Merchandise</dt> <dd id="summary-merchandise" class="text-right">$0.00</dd>
                        <dt>Shipping</dt>    <dd id="summary-shipping" class="text-right">$0.00</dd>
                        <dt>Tax</dt>         <dd id="summary-tax" class="text-right">$0.00</dd>
                        <dt class="font-semibold">Total</dt>
                        <dd id="summary-total" class="text-right font-semibold">$0.00</dd>
                    </dl>

                    <div id="checkout" class="mt-6 flex justify-end">
                        <button type="button" id="checkout-btn" class="w-full rounded-md bg-stone-800 px-6 py-3 text-sm font-medium text-white hover:bg-stone-700 focus:outline-none focus:ring-2 focus:ring-stone-500 focus:ring-offset-2 sm:w-auto">Checkout</button>
                    </div>
                </div>
            </div>
        </article>

    </main>

    <footer class="border-t border-stone-200 bg-white">
        <div class="mx-auto flex max-w-7xl flex-col gap-4 px-4 py-8 text-sm text-stone-500 sm:flex-row sm:items-center sm:justify-between">
            <p>&copy;2026 COMP 3612 Assignment 2</p>
            <ul class="flex gap-4">
                <li><a href="https://github.com/takhdeer/web-assign2">Assignment Github repo</a></li>
                <li><a href="https://github.com/takhdeer">Takhdeer's Github</a></li>
                <li><a href="https://github.com/AaronArrieta">Aaron's Github</a></li>
            </ul>
        </div>

    </footer>

    <!-- about dialog -->
    <dialog id="about" class="m-auto w-full max-w-2xl rounded-3xl p-0 shadow-2xl backdrop:bg-stone-900/60">
        <form method="dialog" class="relative p-8">
            <button type="submit" aria-label="Close" class="absolute right-4 top-4 flex h-9 w-9 items-center justify-center rounded-full text-xl text-stone-500 hover:bg-stone-100">
                &times;
            </button>       
        (About)
        </form>
    </dialog>

    <script type="module" src="js/main.js"></script>
</body>
</html>
